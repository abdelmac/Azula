name: azula
services:
  db:
    image: postgres:17.11-bookworm
    environment:
      POSTGRES_DB: ${DB_NAME:-azula}
      POSTGRES_USER: ${DB_USER:-azula}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Exécutez python scripts/setup_env.py}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped
  backend:
    build: .
    env_file: .env
    environment:
      DB_HOST: db
      DB_PORT: 5432
    ports:
      - "127.0.0.1:8080:8000"
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
volumes:
  postgres_data:
